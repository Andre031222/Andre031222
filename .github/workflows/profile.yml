# Builds the live images of the profile README (stats, languages, snake, 3D contributions)
# and publishes them to the `output` branch. Nothing is committed to `main`, so the
# repository's contributor list stays as it is.
name: Profile images

on:
  schedule:
    - cron: "0 6 * * *"     # every day, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Stats and languages cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 .github/scripts/stats.py "${{ github.repository_owner }}" dist

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00F740&color_dots=#0b1630,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?color_snake=#0f2a55

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D images
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Update profile images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
